[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-assistant"
version = "0.1.0"
description = "Rocky, Jarvis, Mother and Skynet: a local multi-agent personal assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pyyaml>=6",
  "tzdata; sys_platform == 'win32'",   # Windows has no system timezone database for zoneinfo
]

[project.optional-dependencies]
google = ["google-api-python-client>=2.100", "google-auth-oauthlib>=1.2", "google-auth>=2.28"]
discord = ["discord.py>=2.3"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
assistant = "assistant.__main__:main"

[tool.setuptools]
packages = ["assistant", "assistant.agents", "assistant.tools", "assistant.collectors"]

[tool.setuptools.package-data]
assistant = ["web/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["tests"]
