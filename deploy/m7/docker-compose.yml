# Long-running containers on M7. The assistant itself runs under systemd (lighter on an HDD box).
#   cd /opt/assistant/deploy/m7 && docker compose up -d
services:
  sandbox:
    image: pa-sandbox:latest
    build: ../../sandbox
    container_name: pa-sandbox
    restart: unless-stopped
    init: true          # reaps killed/timed-out processes (no zombies)
    user: "${PA_UID:-1000}:${PA_GID:-1000}"   # same uid as the `assistant` service user
    environment:
      HOME: /home/agent
      GIT_AUTHOR_NAME: Jarvis
      GIT_AUTHOR_EMAIL: jarvis@localhost
      GIT_COMMITTER_NAME: Jarvis
      GIT_COMMITTER_EMAIL: jarvis@localhost
    mem_limit: 2g
    cpus: 2
    volumes:
      - ${VAULT:-/mnt/vault}/sandbox-work:/work
      - ${VAULT:-/mnt/vault}/assistant/claude-home:/home/agent
    # Internet yes; nothing from the host except these two folders.

  # Optional: self-hosted push notifications instead of ntfy.sh.
  # Then set NTFY_URL=http://m7:8080 in .env and point the ntfy phone app at it (via Tailscale).
  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    container_name: pa-ntfy
    command: serve
    restart: unless-stopped
    profiles: [ntfy]
    ports: ["8080:80"]
    volumes:
      - ${VAULT:-/mnt/vault}/ntfy:/var/lib/ntfy
    environment:
      NTFY_BASE_URL: http://m7:8080
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
